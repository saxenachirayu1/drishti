# Applies every migration and the seed to a fresh PostGIS database and runs the
# SQL integration tests in supabase/tests.
name: db

on:
  push:
    branches: [main]
    paths: ["supabase/**", ".github/workflows/db.yml"]
  pull_request:
    paths: ["supabase/**", ".github/workflows/db.yml"]
  workflow_dispatch:

jobs:
  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get install -y --no-install-recommends postgresql-client
      - run: bash supabase/tests/run.sh
