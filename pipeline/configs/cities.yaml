# Cities the pipeline covers (N-19: adding a city is config only).
# id must match the row in Supabase public.cities. Pilot cities are still to be confirmed;
# the bboxes below are approximate placeholders.
cities:
  # Pilot cities per the team README. The ids match public.cities in Supabase,
  # and the bboxes bracket the seeded sites (Indore 75.80,22.65 and 75.85,22.72;
  # Bhopal 77.40,23.20). Both fall in UTM zone 43N. Member B: confirm the extents
  # before a real run - these are working values, not surveyed ones.
  - id: indore
    name: Indore
    bbox: [75.75, 22.60, 75.95, 22.80]   # west, south, east, north
    utm_epsg: 32643
    labels: labels/indore.geojson
  - id: bhopal
    name: Bhopal
    bbox: [77.28, 23.12, 77.52, 23.34]
    utm_epsg: 32643
    labels: labels/bhopal.geojson
  - id: 11111111-1111-1111-1111-111111111111
    name: Pune
    bbox: [73.74, 18.42, 73.98, 18.64]   # west, south, east, north
    utm_epsg: 32643
    labels: labels/pune.geojson
  - id: 22222222-2222-2222-2222-222222222222
    name: Delhi
    bbox: [76.84, 28.40, 77.35, 28.88]
    utm_epsg: 32643
    labels: labels/delhi.geojson
