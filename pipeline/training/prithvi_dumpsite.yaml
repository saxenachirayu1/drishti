# B-08: fine-tune Prithvi-EO-2.0 for 2-class segmentation (waste / not waste) with TerraTorch.
#   terratorch fit -c training/prithvi_dumpsite.yaml
#   terratorch test -c training/prithvi_dumpsite.yaml --ckpt_path <best.ckpt>
# Built from the shape of TerraTorch's own segmentation examples (e.g. burn scars). Field names can
# shift between TerraTorch releases: if `fit` rejects a key, compare with the example config of the
# installed version and adjust here. means/stds must equal PRITHVI_MEANS/STDS in drishti_pipeline/config.py.

seed_everything: 42

trainer:
  accelerator: auto
  devices: 1
  precision: 16-mixed
  max_epochs: 40
  log_every_n_steps: 5
  default_root_dir: outputs/prithvi_dumpsite
  callbacks:
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        monitor: val/Multiclass_Jaccard_Index
        mode: max
        save_top_k: 1
        filename: best
    - class_path: lightning.pytorch.callbacks.EarlyStopping
      init_args:
        monitor: val/loss
        patience: 8

data:
  class_path: terratorch.datamodules.GenericNonGeoSegmentationDataModule
  init_args:
    batch_size: 8
    num_workers: 2
    num_classes: 2
    train_data_root: data/dataset/train/images
    train_label_data_root: data/dataset/train/masks
    val_data_root: data/dataset/val/images
    val_label_data_root: data/dataset/val/masks
    test_data_root: data/dataset/test/images
    test_label_data_root: data/dataset/test/masks
    img_grep: "*_img.tif"
    label_grep: "*_mask.tif"
    dataset_bands: [BLUE, GREEN, RED, NIR_NARROW, SWIR_1, SWIR_2]
    output_bands: [BLUE, GREEN, RED, NIR_NARROW, SWIR_1, SWIR_2]
    means: [1087.0, 1342.0, 1433.0, 2734.0, 1958.0, 1363.0]
    stds: [2248.0, 2179.0, 2178.0, 1850.0, 1242.0, 1049.0]
    no_data_replace: 0
    no_label_replace: -1
    train_transform:
      - class_path: albumentations.D4          # flips and 90-degree rotations
      - class_path: albumentations.pytorch.transforms.ToTensorV2

model:
  class_path: terratorch.tasks.SemanticSegmentationTask
  init_args:
    model_factory: EncoderDecoderFactory
    model_args:
      backbone: prithvi_eo_v2_300
      backbone_pretrained: true
      backbone_bands: [BLUE, GREEN, RED, NIR_NARROW, SWIR_1, SWIR_2]
      necks:
        - name: SelectIndices
          indices: [5, 11, 17, 23]
        - name: ReshapeTokensToImage
      decoder: UperNetDecoder
      decoder_channels: 256
      head_dropout: 0.1
      num_classes: 2
    loss: dice
    ignore_index: -1
    class_names: [not_waste, waste]
    freeze_backbone: false

optimizer:
  class_path: torch.optim.AdamW
  init_args:
    lr: 1.0e-4
    weight_decay: 0.05

lr_scheduler:
  class_path: ReduceLROnPlateau
  init_args:
    monitor: val/loss
    patience: 4
