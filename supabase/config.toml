# Supabase CLI config for local development (A-01): `supabase start`, then
# `supabase db reset` applies migrations/ and seed.sql to a local database.
# Unlisted settings use the CLI defaults. The hosted project is linked with
# `supabase link --project-ref ofudjcrzdgltpoyavibr`.
project_id = "drishti"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]

[db]
port = 54322
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[realtime]
enabled = true

[storage]
enabled = true

[auth]
enabled = true
site_url = "http://localhost:3000"

[auth.email]
enable_signup = true
enable_confirmations = false
otp_length = 6
